<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双摆混沌模拟器 — Week 05 Double Pendulum Lab</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a24;
    height: 100%;
    overflow: hidden;
    font-family: "Consolas", "Courier New", monospace;
  }
  #stage {
    display: block;
    margin: 0 auto;
    cursor: grab;
  }
  #stage.dragging { cursor: grabbing; }
  #hud {
    position: fixed;
    top: 14px;
    left: 16px;
    color: #8fd3ff;
    font-size: 13px;
    line-height: 1.7;
    text-shadow: 0 0 6px rgba(143, 211, 255, .45);
    pointer-events: none;
    white-space: pre;
  }
  #panel {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    background: rgba(30, 30, 44, .88);
    border: 1px solid rgba(143, 211, 255, .22);
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
    color: #cfd8e3;
    font-size: 13px;
  }
  #panel label {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #panel input[type="range"] {
    width: 130px;
    accent-color: #4f9dd6;
    cursor: pointer;
  }
  #panel .val {
    color: #8fd3ff;
    text-shadow: 0 0 6px rgba(143, 211, 255, .4);
  }
  #resetBtn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid rgba(143, 211, 255, .5);
    border-radius: 6px;
    color: #8fd3ff;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  #resetBtn:hover {
    background: rgba(79, 157, 214, .18);
    box-shadow: 0 0 10px rgba(120, 200, 255, .35);
  }
</style>
</head>
<body>
<div id="hud"></div>
<canvas id="stage"></canvas>
<div id="panel">
  <label>摆长1 <span class="val" id="l1Val">160 px</span>
    <input type="range" id="l1Slider" min="80" max="220" step="1" value="160">
  </label>
  <label>摆长2 <span class="val" id="l2Val">160 px</span>
    <input type="range" id="l2Slider" min="80" max="220" step="1" value="160">
  </label>
  <label>重力 <span class="val" id="gVal">9.8 m/s²</span>
    <input type="range" id="gSlider" min="1" max="25" step="0.1" value="9.8">
  </label>
  <label>阻尼 <span class="val" id="dampVal">0.000</span>
    <input type="range" id="dampSlider" min="0" max="0.01" step="0.0005" value="0">
  </label>
  <button id="resetBtn" type="button">重置双摆</button>
</div>
<script>
(function () {
  "use strict";

  // ---------- 参数 ----------
  var PIXELS_PER_METER = 100;
  var L1_PX = 160, L2_PX = 160;         // 两段摆长（像素）
  var M1 = 10, M2 = 10;                 // 质量（等质量）
  var G = 9.8;
  var DAMPING = 0;                      // 0~0.01，内部放大 100 倍
  var THETA1_0 = 120 * Math.PI / 180;   // 初始角高于水平，保证混沌翻转
  var THETA2_0 = 120 * Math.PI / 180;
  var BOB1_R = 13, BOB2_R = 11;
  var TRAIL_MAX = 420;

  function l1m() { return L1_PX / PIXELS_PER_METER; }
  function l2m() { return L2_PX / PIXELS_PER_METER; }

  // ---------- 状态 [θ1, ω1, θ2, ω2] ----------
  var th1 = THETA1_0, w1 = 0, th2 = THETA2_0, w2 = 0;
  var anchor = { x: 0, y: 0 };
  var trail = [];                       // {x, y, hue}
  var hueClock = 0;
  var lastTime = null;
  var clock = 0;
  var dragTarget = 0;                   // 0=无 1=摆球1 2=摆球2

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var hud = document.getElementById("hud");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    anchor.x = canvas.width / 2;
    anchor.y = canvas.height * 0.28;
  }
  window.addEventListener("resize", resize);
  resize();

  function bobPos() {
    var x1 = anchor.x + L1_PX * Math.sin(th1);
    var y1 = anchor.y + L1_PX * Math.cos(th1);
    var x2 = x1 + L2_PX * Math.sin(th2);
    var y2 = y1 + L2_PX * Math.cos(th2);
    return { x1: x1, y1: y1, x2: x2, y2: y2 };
  }

  // ---------- 双摆运动方程（拉格朗日质量矩阵，每步解 2x2 线性系统） ----------
  function derivs(t1, o1, t2, o2) {
    var L1 = l1m(), L2 = l2m();
    var d = t1 - t2;
    var sd = Math.sin(d), cd = Math.cos(d);
    var b = DAMPING * 100;

    var a11 = (M1 + M2) * L1, a12 = M2 * L2 * cd;
    var a21 = M2 * L1 * cd,   a22 = M2 * L2;
    var rhs1 = -M2 * L2 * o2 * o2 * sd - (M1 + M2) * G * Math.sin(t1) - b * o1;
    var rhs2 =  M2 * L1 * o1 * o1 * sd - M2 * G * Math.sin(t2) - b * o2;
    var det = a11 * a22 - a12 * a21;

    return [o1, (rhs1 * a22 - rhs2 * a12) / det,
            o2, (a11 * rhs2 - a21 * rhs1) / det];
  }

  // ---------- RK4 4 阶积分 ----------
  function rk4(dt) {
    var s0 = [th1, w1, th2, w2];
    var k1 = derivs(s0[0], s0[1], s0[2], s0[3]);
    var k2 = derivs(s0[0] + dt / 2 * k1[0], s0[1] + dt / 2 * k1[1],
                    s0[2] + dt / 2 * k1[2], s0[3] + dt / 2 * k1[3]);
    var k3 = derivs(s0[0] + dt / 2 * k2[0], s0[1] + dt / 2 * k2[1],
                    s0[2] + dt / 2 * k2[2], s0[3] + dt / 2 * k2[3]);
    var k4 = derivs(s0[0] + dt * k3[0], s0[1] + dt * k3[1],
                    s0[2] + dt * k3[2], s0[3] + dt * k3[3]);
    th1 += dt / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
    w1  += dt / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
    th2 += dt / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
    w2  += dt / 6 * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]);
  }

  // ---------- 能量（数值守恒监测） ----------
  function energy() {
    var L1 = l1m(), L2 = l2m();
    var v1sq = L1 * L1 * w1 * w1;
    var v2sq = v1sq + L2 * L2 * w2 * w2 + 2 * L1 * L2 * w1 * w2 * Math.cos(th1 - th2);
    var KE = 0.5 * M1 * v1sq + 0.5 * M2 * v2sq;
    var PE = -(M1 + M2) * G * L1 * Math.cos(th1) - M2 * G * L2 * Math.cos(th2);
    return KE + PE;
  }

  // ---------- 绘制 ----------
  function draw() {
    ctx.fillStyle = "#1a1a24";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    var p = bobPos();

    // 彩虹拖尾：半透明 HSL 圆点，透明度随年龄平方衰减
    for (var i = 0; i < trail.length; i++) {
      var a = i / trail.length;
      var t = trail[i];
      ctx.fillStyle = "hsla(" + t.hue + ", 100%, 62%, " + (a * a * 0.55) + ")";
      ctx.beginPath();
      ctx.arc(t.x, t.y, 1 + a * 3.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 顶部横梁与支点
    ctx.strokeStyle = "rgba(143, 211, 255, .35)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(anchor.x - 70, anchor.y);
    ctx.lineTo(anchor.x + 70, anchor.y);
    ctx.stroke();
    ctx.fillStyle = "#cfd8e3";
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 5, 0, Math.PI * 2);
    ctx.fill();

    // 摆杆
    ctx.strokeStyle = "rgba(207, 216, 227, .8)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(anchor.x, anchor.y);
    ctx.lineTo(p.x1, p.y1);
    ctx.lineTo(p.x2, p.y2);
    ctx.stroke();

    // 摆球 1
    ctx.save();
    ctx.shadowColor = "rgba(120, 200, 255, .9)";
    ctx.shadowBlur = 22;
    var g1 = ctx.createRadialGradient(p.x1 - 4, p.y1 - 4, 2, p.x1, p.y1, BOB1_R);
    g1.addColorStop(0, "#bfe6ff");
    g1.addColorStop(1, "#2f7fd6");
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(p.x1, p.y1, BOB1_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 摆球 2（发光色与拖尾彩虹相位同步）
    ctx.save();
    ctx.shadowColor = "hsla(" + hueClock + ", 100%, 65%, .95)";
    ctx.shadowBlur = 26;
    var g2 = ctx.createRadialGradient(p.x2 - 3, p.y2 - 3, 2, p.x2, p.y2, BOB2_R);
    g2.addColorStop(0, "#ffffff");
    g2.addColorStop(1, "hsl(" + hueClock + ", 100%, 60%)");
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(p.x2, p.y2, BOB2_R, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // HUD
    hud.textContent =
      "双摆混沌模拟器 Week 05\n" +
      "L1 = " + L1_PX + " px   L2 = " + L2_PX + " px   g = " + G.toFixed(1) + " m/s²   阻尼 = " + DAMPING.toFixed(3) + "\n" +
      "θ1 = " + (th1 * 180 / Math.PI).toFixed(1) + "°   θ2 = " + (th2 * 180 / Math.PI).toFixed(1) + "°\n" +
      "E = " + energy().toFixed(3) + " J   t = " + clock.toFixed(1) + " s" +
      (dragTarget ? "   [拖拽中]" : "");
  }

  // ---------- 鼠标拖拽 ----------
  function mouse(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  canvas.addEventListener("mousedown", function (e) {
    var m = mouse(e), p = bobPos();
    var d2 = Math.hypot(m.x - p.x2, m.y - p.y2);
    var d1 = Math.hypot(m.x - p.x1, m.y - p.y1);
    if (d2 < BOB2_R + 14) dragTarget = 2;
    else if (d1 < BOB1_R + 14) dragTarget = 1;
    if (dragTarget) {
      canvas.classList.add("dragging");
      w1 = 0; w2 = 0;
      trail.length = 0;
    }
  });

  canvas.addEventListener("mousemove", function (e) {
    if (!dragTarget) return;
    var m = mouse(e);
    if (dragTarget === 1) {
      th1 = Math.atan2(m.x - anchor.x, m.y - anchor.y);
    } else {
      var p = bobPos();
      th2 = Math.atan2(m.x - p.x1, m.y - p.y1);
    }
    w1 = 0; w2 = 0;
  });

  function endDrag() {
    dragTarget = 0;
    canvas.classList.remove("dragging");
  }
  window.addEventListener("mouseup", endDrag);

  // ---------- 控制面板 ----------
  var l1Slider = document.getElementById("l1Slider");
  var l2Slider = document.getElementById("l2Slider");
  var gSlider = document.getElementById("gSlider");
  var dampSlider = document.getElementById("dampSlider");

  l1Slider.addEventListener("input", function () {
    L1_PX = Number(l1Slider.value);
    document.getElementById("l1Val").textContent = L1_PX + " px";
    trail.length = 0;
  });
  l2Slider.addEventListener("input", function () {
    L2_PX = Number(l2Slider.value);
    document.getElementById("l2Val").textContent = L2_PX + " px";
    trail.length = 0;
  });
  gSlider.addEventListener("input", function () {
    G = Number(gSlider.value);
    document.getElementById("gVal").textContent = G.toFixed(1) + " m/s²";
  });
  dampSlider.addEventListener("input", function () {
    DAMPING = Number(dampSlider.value);
    document.getElementById("dampVal").textContent = DAMPING.toFixed(3);
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    th1 = THETA1_0; w1 = 0;
    th2 = THETA2_0; w2 = 0;
    clock = 0;
    hueClock = 0;
    trail.length = 0;
  });

  // ---------- 主循环 ----------
  function loop(now) {
    if (lastTime === null) lastTime = now;
    var dt = Math.min((now - lastTime) / 1000, 0.05); // 防跳帧
    lastTime = now;

    if (!dragTarget) {
      clock += dt;
      var sub = Math.max(1, Math.ceil(dt / 0.002));   // 2ms 细分步长防数值发散
      for (var i = 0; i < sub; i++) rk4(dt / sub);

      var p = bobPos();
      hueClock = (hueClock + dt * 90) % 360;
      trail.push({ x: p.x2, y: p.y2, hue: hueClock });
      if (trail.length > TRAIL_MAX) trail.shift();
    }

    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
