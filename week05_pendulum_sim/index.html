<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆模拟器 — Week 05 Pendulum Lab</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1a1a24;
    height: 100%;
    overflow: hidden;
    font-family: "Consolas", "Courier New", monospace;
  }
  #stage {
    display: block;
    margin: 0 auto;
  }
  #hud {
    position: fixed;
    top: 14px;
    left: 16px;
    color: #8fd3ff;
    font-size: 13px;
    line-height: 1.7;
    text-shadow: 0 0 6px rgba(143, 211, 255, .45);
    pointer-events: none;
    white-space: pre;
  }
  #panel {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    background: rgba(30, 30, 44, .88);
    border: 1px solid rgba(143, 211, 255, .22);
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, .5);
    color: #cfd8e3;
    font-size: 13px;
  }
  #panel label {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #panel input[type="range"] {
    width: 140px;
    accent-color: #4f9dd6;
    cursor: pointer;
  }
  #panel .val {
    color: #8fd3ff;
    text-shadow: 0 0 6px rgba(143, 211, 255, .4);
  }
  #resetBtn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid rgba(143, 211, 255, .5);
    border-radius: 6px;
    color: #8fd3ff;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  #resetBtn:hover {
    background: rgba(79, 157, 214, .18);
    box-shadow: 0 0 10px rgba(120, 200, 255, .35);
  }
</style>
</head>
<body>
<div id="hud"></div>
<canvas id="stage"></canvas>
<div id="panel">
  <label>摆长 <span class="val" id="lenVal">200 px</span>
    <input type="range" id="lenSlider" min="100" max="350" step="1" value="200">
  </label>
  <label>重力 <span class="val" id="gVal">9.8 m/s²</span>
    <input type="range" id="gSlider" min="1" max="25" step="0.1" value="9.8">
  </label>
  <label>阻尼 <span class="val" id="dampVal">0.000</span>
    <input type="range" id="dampSlider" min="0" max="0.01" step="0.0005" value="0">
  </label>
  <button id="resetBtn" type="button">重置摆动</button>
</div>
<script>
(function () {
  "use strict";

  // ---------- 参数（滑块可实时调节） ----------
  var PIXELS_PER_METER = 100;      // 像素-物理量换算
  var L_PX = 200;                  // 摆长（像素）
  var G = 9.8;                     // 重力加速度 m/s^2
  var THETA0 = 45 * Math.PI / 180; // 初始摆角（弧度）
  var DAMPING = 0;                 // 阻尼系数 0~0.01，内部放大 100 倍使衰减在数十秒内可见
  var BOB_RADIUS = 16;

  function lM() { return L_PX / PIXELS_PER_METER; }

  // ---------- 状态 ----------
  var theta = THETA0;
  var omega = 0;                   // 角速度 rad/s
  var anchor = { x: 0, y: 0 };
  var trail = [];
  var lastTime = null;
  var clock = 0;

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var hud = document.getElementById("hud");

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    anchor.x = canvas.width / 2;
    anchor.y = canvas.height * 0.22;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- 物理积分（RK4，非线性单摆方程 θ'' = -(g/L)sinθ） ----------
  function accel(th) {
    return -(G / lM()) * Math.sin(th) - (DAMPING * 100) * omega;
  }

  function step(dt) {
    var k1t = omega;
    var k1w = accel(theta);
    var k2t = omega + 0.5 * dt * k1w;
    var k2w = accel(theta + 0.5 * dt * k1t);
    var k3t = omega + 0.5 * dt * k2w;
    var k3w = accel(theta + 0.5 * dt * k2t);
    var k4t = omega + dt * k3w;
    var k4w = accel(theta + dt * k3t);
    theta += dt / 6 * (k1t + 2 * k2t + 2 * k3t + k4t);
    omega += dt / 6 * (k1w + 2 * k2w + 2 * k3w + k4w);
  }

  // ---------- 绘制 ----------
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景（深灰科技色）
    ctx.fillStyle = "#1a1a24";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 顶部横梁
    ctx.strokeStyle = "rgba(143, 211, 255, .35)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(anchor.x - 70, anchor.y);
    ctx.lineTo(anchor.x + 70, anchor.y);
    ctx.stroke();

    // 支点
    ctx.fillStyle = "#cfd8e3";
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 5, 0, Math.PI * 2);
    ctx.fill();

    var bx = anchor.x + L_PX * Math.sin(theta);
    var by = anchor.y + L_PX * Math.cos(theta);

    // 摆球轨迹残影
    trail.push({ x: bx, y: by });
    if (trail.length > 90) trail.shift();
    for (var i = 0; i < trail.length; i++) {
      var a = i / trail.length;
      ctx.fillStyle = "rgba(80, 170, 255, " + (a * 0.18) + ")";
      ctx.beginPath();
      ctx.arc(trail[i].x, trail[i].y, 3 * a + 1, 0, Math.PI * 2);
      ctx.fill();
    }

    // 摆线
    ctx.strokeStyle = "rgba(207, 216, 227, .8)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(anchor.x, anchor.y);
    ctx.lineTo(bx, by);
    ctx.stroke();

    // 摆球 + 微弱发光光效
    ctx.save();
    ctx.shadowColor = "rgba(120, 200, 255, .9)";
    ctx.shadowBlur = 28;
    var grad = ctx.createRadialGradient(
      bx - BOB_RADIUS * 0.35, by - BOB_RADIUS * 0.35, 2,
      bx, by, BOB_RADIUS
    );
    grad.addColorStop(0, "#bfe6ff");
    grad.addColorStop(1, "#2f7fd6");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(bx, by, BOB_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // HUD 数据
    var deg = (theta * 180 / Math.PI).toFixed(1);
    var period = 2 * Math.PI * Math.sqrt(lM() / G); // 小周期近似
    hud.textContent =
      "单摆模拟器 Week 05\n" +
      "L = " + L_PX + " px (" + lM().toFixed(1) + " m)   g = " + G.toFixed(1) + " m/s²   阻尼 = " + DAMPING.toFixed(3) + "\n" +
      "θ = " + deg + "°   ω = " + omega.toFixed(2) + " rad/s\n" +
      "T₀ ≈ " + period.toFixed(2) + " s   t = " + clock.toFixed(1) + " s";
  }

  // ---------- 主循环 ----------
  function loop(now) {
    if (lastTime === null) lastTime = now;
    var dt = Math.min((now - lastTime) / 1000, 0.05); // 防跳帧
    lastTime = now;
    clock += dt;

    // 细分步长，保证数值稳定
    var sub = Math.max(1, Math.ceil(dt / 0.005));
    for (var i = 0; i < sub; i++) step(dt / sub);

    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 交互控制面板 ----------
  var lenSlider = document.getElementById("lenSlider");
  var gSlider = document.getElementById("gSlider");
  var dampSlider = document.getElementById("dampSlider");
  var lenVal = document.getElementById("lenVal");
  var gVal = document.getElementById("gVal");
  var dampVal = document.getElementById("dampVal");

  lenSlider.addEventListener("input", function () {
    L_PX = Number(lenSlider.value);
    lenVal.textContent = L_PX + " px";
    trail.length = 0;
  });
  gSlider.addEventListener("input", function () {
    G = Number(gSlider.value);
    gVal.textContent = G.toFixed(1) + " m/s²";
  });
  dampSlider.addEventListener("input", function () {
    DAMPING = Number(dampSlider.value);
    dampVal.textContent = DAMPING.toFixed(3);
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    theta = THETA0;
    omega = 0;
    clock = 0;
    trail.length = 0;
  });

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
